name: Release Linux asset

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload Linux AppImage to, for example v1.0.5"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-linux-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.12.0"

jobs:
  build-upload:
    name: Build and upload Linux AppImage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Check release tag matches package version
        id: version
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          expected="v${version}"
          if [ "${{ inputs.tag }}" != "$expected" ]; then
            echo "Input tag ${{ inputs.tag }} does not match package version ${expected}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - run: npm run dist:linux -- --publish never

      - run: node scripts/verify-package-smoke.cjs linux x64

      - name: Upload Linux asset to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          chmod +x "release/PokeFollower-${version}.AppImage"
          gh release upload "${{ inputs.tag }}" \
            "release/PokeFollower-${version}.AppImage" \
            --clobber \
            --repo "${{ github.repository }}"
